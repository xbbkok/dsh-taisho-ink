<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Taisho Ink — ambience preview</title>
<style>
  html, body { margin: 0; height: 100%; background: #05060a; }
  .stage { display: flex; gap: 8px; height: 100vh; padding: 8px; box-sizing: border-box; }
  .panel { position: relative; flex: 1; overflow: hidden; border-radius: 10px; }
  .panel.light { background: #f5f0e6; }
  .panel.dark { background: #0c0e13; }
  .panel .ti-atm { position: absolute; inset: 0; }
  .cap {
    position: absolute; left: 14px; bottom: 12px; z-index: 3;
    font: 11px/1 "Segoe UI", system-ui, sans-serif; letter-spacing: .14em;
    text-transform: uppercase; opacity: .55;
  }
  .panel.light .cap { color: #6d5c4d; }
  .panel.dark .cap { color: #a79d90; }

  /* ---- rules copied from lib/client.js ---- */
  .ti-atm { pointer-events: none; overflow: hidden; }
  .ti-atm-glow { position: absolute; inset: -16%;
    background:
      radial-gradient(46% 38% at 90% 4%, color-mix(in srgb, #c9302c 24%, transparent), transparent 70%),
      radial-gradient(44% 36% at 6% 94%, color-mix(in srgb, #3a2b52 26%, transparent), transparent 72%),
      radial-gradient(38% 28% at 48% 0%, color-mix(in srgb, #e0a03a 12%, transparent), transparent 70%); }
  .ti-atm-paper { position: absolute; inset: 0; opacity: .55;
    background-image:
      repeating-linear-gradient(92deg, color-mix(in srgb, #2b2320 4%, transparent) 0 1px, transparent 1px 11px),
      repeating-linear-gradient(2deg, color-mix(in srgb, #2b2320 3%, transparent) 0 1px, transparent 1px 15px); }
  .panel.dark .ti-atm-paper { background-image:
      repeating-linear-gradient(92deg, color-mix(in srgb, #f3ece2 4%, transparent) 0 1px, transparent 1px 11px),
      repeating-linear-gradient(2deg, color-mix(in srgb, #f3ece2 3%, transparent) 0 1px, transparent 1px 15px); }
  .ti-atm-vignette { position: absolute; inset: 0;
    background: radial-gradient(120% 100% at 50% 38%, transparent 52%, color-mix(in srgb, #2b2320 15%, transparent) 100%); }
  .panel.dark .ti-atm-vignette {
    background: radial-gradient(120% 100% at 50% 38%, transparent 52%, color-mix(in srgb, #f3ece2 12%, transparent) 100%); }

  .ti-embers, .ti-petals { position: absolute; inset: 0; }
  .ti-ember { position: absolute; bottom: -4%; border-radius: 50%;
    background: radial-gradient(circle at 50% 50%, #ffd9a3, #e2542a 62%, transparent 74%);
    box-shadow: 0 0 9px rgba(226, 84, 42, .55);
    animation-name: ti-rise; animation-timing-function: ease-out; animation-iteration-count: infinite;
    will-change: transform, opacity; }
  @keyframes ti-rise {
    0% { transform: translate3d(0, 8vh, 0) scale(.7); opacity: 0; }
    14% { opacity: .85; }
    64% { opacity: .5; }
    100% { transform: translate3d(18px, -104vh, 0) scale(1.12); opacity: 0; } }

  .ti-petal { position: absolute; top: -8%; display: block; will-change: transform;
    animation-name: ti-fall; animation-timing-function: linear; animation-iteration-count: infinite; }
  .ti-petal span { display: block; width: 100%; height: 100%; animation: ti-swing 4.6s ease-in-out infinite alternate; }
  @keyframes ti-fall { 0% { transform: translate3d(0, -8vh, 0) rotate(0deg); } 100% { transform: translate3d(-36px, 112vh, 0) rotate(260deg); } }
  @keyframes ti-swing { 0% { transform: translateX(-7px) rotate(-7deg); } 100% { transform: translateX(9px) rotate(9deg); } }
</style>
</head>
<body>
<div class="stage">
  <div class="panel light">
    <div class="ti-atm">
      <div class="ti-atm-glow"></div>
      <div class="ti-atm-paper"></div>
      <div class="ti-embers"></div>
      <div class="ti-petals"></div>
      <div class="ti-atm-vignette"></div>
    </div>
    <span class="cap">light · washi</span>
  </div>
  <div class="panel dark">
    <div class="ti-atm">
      <div class="ti-atm-glow"></div>
      <div class="ti-atm-paper"></div>
      <div class="ti-embers"></div>
      <div class="ti-petals"></div>
      <div class="ti-atm-vignette"></div>
    </div>
    <span class="cap">dark · ink</span>
  </div>
</div>
<script>
  // Same deterministic paint as lib/client.js.
  let seed = 20261022
  function next() {
    seed = (seed * 1103515245 + 12345) % 2147483648
    return seed / 2147483648
  }
  const EMBERS = Array.from({ length: 18 }, () => ({
    left: (next() * 100).toFixed(2),
    size: Math.round(3 + next() * 4),
    rise: (13 + next() * 10).toFixed(1),
    delay: (-next() * 22).toFixed(1),
    opacity: (0.45 + next() * 0.4).toFixed(2),
  }))
  const PETALS = Array.from({ length: 10 }, () => ({
    left: (next() * 100).toFixed(2),
    size: Math.round(9 + next() * 5),
    fall: (18 + next() * 12).toFixed(1),
    delay: (-next() * 26).toFixed(1),
    opacity: (0.3 + next() * 0.35).toFixed(2),
  }))

  function petalSvg() {
    return '<svg viewBox="0 0 14 20" width="100%" height="100%" aria-hidden="true" focusable="false">'
      + '<defs><linearGradient id="ti-wisteria" x1="0" y1="0" x2="0.4" y2="1">'
      + '<stop offset="0" stop-color="#cfc3f2"/><stop offset="1" stop-color="#8f7fc9"/>'
      + '</linearGradient></defs>'
      + '<path d="M7 0C10.6 4 11.8 9.4 10.4 14.2C9.4 17.8 5.2 19.6 2.8 17.2C0.6 15 -0.2 10.6 1.6 6.6C2.8 3.8 4.6 1.4 7 0Z" fill="url(#ti-wisteria)"/>'
      + '<path d="M7.2 3.2C9 6.4 9.6 10.2 8.6 13.2" stroke="#efe9ff" stroke-width="1" fill="none" stroke-opacity="0.55" stroke-linecap="round"/>'
      + '</svg>'
  }

  for (const panel of document.querySelectorAll('.panel')) {
    const embers = panel.querySelector('.ti-embers')
    const petals = panel.querySelector('.ti-petals')
    for (const ember of EMBERS) {
      const el = document.createElement('span')
      el.className = 'ti-ember'
      el.dataset.delay = ember.delay
      el.style.cssText = 'left:' + ember.left + '%;width:' + ember.size + 'px;height:' + ember.size
        + 'px;opacity:' + ember.opacity + ';animation-duration:' + ember.rise + 's;animation-delay:' + ember.delay + 's'
      embers.appendChild(el)
    }
    for (const petal of PETALS) {
      const el = document.createElement('span')
      el.className = 'ti-petal'
      el.dataset.delay = petal.delay
      el.style.cssText = 'left:' + petal.left + '%;width:' + petal.size + 'px;height:'
        + Math.round(petal.size * 1.42) + 'px;opacity:' + petal.opacity
        + ';animation-duration:' + petal.fall + 's;animation-delay:' + petal.delay + 's'
      const inner = document.createElement('span')
      inner.dataset.delay = petal.delay
      inner.style.animationDelay = petal.delay + 's'
      inner.innerHTML = petalSvg()
      el.appendChild(inner)
      petals.appendChild(el)
    }
  }

  // Freeze every animation at the requested time so each screenshot is exact.
  const t = parseFloat(new URLSearchParams(location.search).get('t') || '0')
  for (const el of document.querySelectorAll('.ti-ember, .ti-petal, .ti-petal span')) {
    const base = parseFloat(el.dataset.delay || '0')
    el.style.animationPlayState = 'paused'
    el.style.animationDelay = (base - t).toFixed(3) + 's'
  }
</script>
</body>
</html>
